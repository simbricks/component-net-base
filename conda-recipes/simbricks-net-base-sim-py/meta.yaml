# NOTE: This recipe is a skeleton hull. The python package it builds
# (../../simbricks-net-base-python) is currently a placeholder; flesh out the
# package and revisit the requirements below as real dependencies are added.

package:
  name: simbricks-net-base-sim-py
  version: {{ simbricks_version }}

source:
  path: ../../simbricks-net-base-python

build:
  number: 0
  noarch: python

requirements:
  host:
    - python
    - pip
    - poetry-core

  run:
    - python

about:
  home: {{ homepage }}
  license: MIT
  license_family: MIT
  license_file: ../../LICENSE
  summary: SimBricks net-base Python integration package.
  dev_url: {{ github_org }}
